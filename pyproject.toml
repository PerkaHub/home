[project]
name = "domprozrachno"
version = "0.8.0"
description = "DomProzrachno training API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "structlog>=25,<26",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/check_docs.py", "scripts/check_payment_protocol.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["domprozrachno"]
relative_files = true

[tool.coverage.report]
fail_under = 70
show_missing = true
