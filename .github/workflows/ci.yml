name: documentation
on:
  push:
  pull_request:
jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_docs.py
      - run: python scripts/check_docs.py --self-test
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run diagrams
      - run: npm run test:diagrams
      - uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: build/diagrams/*.svg
