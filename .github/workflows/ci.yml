name: CI
on:
  push:
  pull_request:

jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_docs.py
      - run: python scripts/check_docs.py --self-test
      - run: python scripts/check_payment_protocol.py
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run diagrams
      - run: npm run test:diagrams
      - uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: build/diagrams/*.svg

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy src tests
      - run: uv run --locked pytest --cov

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_architecture.py boundaries --self-test

  language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_architecture.py language --self-test

  image:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build and start API and database
        run: docker compose up -d --build --wait
      - name: Smoke test the image
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-connrefused http://127.0.0.1:8080/health |
            python -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          curl -fsS http://127.0.0.1:8080/version |
            python -c 'import json, sys; result = json.load(sys.stdin); assert result["environment"] == "development" and result["version"]'
          docker compose exec -T api python -c \
            'import importlib.util, os; assert os.getuid() != 0; assert all(importlib.util.find_spec(name) is None for name in ("pytest", "ruff", "mypy", "httpx"))'
          docker compose stop db
          curl -fsS http://127.0.0.1:8080/health
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Remove test containers and volume
        if: always()
        run: docker compose down -v
